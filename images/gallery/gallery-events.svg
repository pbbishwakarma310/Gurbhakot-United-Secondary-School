<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="evGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b7a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#evGrad)" />
  
  <!-- Assembly / Stage Podium Graphic -->
  <g transform="translate(300, 160)">
    <!-- Stage Podium -->
    <polygon points="-80,70 80,70 60,10 -60,10" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <rect x="-35" y="-30" width="70" height="40" fill="#ffffff" rx="4" />
    <!-- Microphone -->
    <line x1="0" y1="-30" x2="0" y2="-55" stroke="#94a3b8" stroke-width="4" />
    <circle cx="0" cy="-60" r="10" fill="#334155" />
    
    <!-- Ribbons & Banners -->
    <path d="M -180,-70 Q -90,-40 0,-70 Q 90,-40 180,-70" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="325" width="540" height="55" rx="8" fill="#ffffff" />
  <text x="300" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    विद्यालयका औपचारिक कार्यक्रम तथा सभा / School Ceremonies & Assemblies
  </text>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Gurbhakot United Secondary School
  </text>
</svg>
