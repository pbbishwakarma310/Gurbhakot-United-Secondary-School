<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="culGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#culGrad)" />
  
  <!-- Stage Backdrop Lights -->
  <circle cx="150" cy="50" r="90" fill="#ffffff" opacity="0.15" />
  <circle cx="450" cy="50" r="90" fill="#ffffff" opacity="0.15" />
  <polygon points="150,0 80,300 220,300" fill="#ffffff" opacity="0.08" />
  <polygon points="450,0 380,300 520,300" fill="#ffffff" opacity="0.08" />
  
  <!-- Musical & Dance Elements -->
  <g transform="translate(300, 150)" fill="#ffffff">
    <!-- Musical Note -->
    <path d="M -70,-30 L -70,30 C -70,40 -90,45 -95,35 C -100,25 -80,18 -70,25 L -70,-20 L -30,-30 L -30,20 C -30,30 -50,35 -55,25 C -60,15 -40,8 -30,15 L -30,-30 Z" />
    <!-- Traditional Nepali Madal / Instrument Graphic -->
    <ellipse cx="60" cy="10" rx="45" ry="25" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <circle cx="20" cy="10" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
    <circle cx="100" cy="10" r="18" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
    <line x1="20" y1="5" x2="100" y2="5" stroke="#ffffff" stroke-width="1.5" />
    <line x1="20" y1="15" x2="100" y2="15" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="325" width="540" height="55" rx="8" fill="#ffffff" />
  <text x="300" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    सांस्कृतिक तथा सिर्जनात्मक कार्यक्रम / Cultural & Talent Festival
  </text>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Gurbhakot United Secondary School
  </text>
</svg>
