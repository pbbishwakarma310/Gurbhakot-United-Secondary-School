<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="tAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="350" height="400" fill="#f1f5f9" rx="14" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="175" cy="150" r="90" fill="#e2e8f0" />
  
  <!-- Teacher Avatar -->
  <g transform="translate(175, 160)">
    <circle cx="0" cy="-45" r="42" fill="url(#tAvatar)" />
    <path d="M -70,80 C -70,18 -42,0 0,0 C 42,0 70,18 70,80 Z" fill="url(#tAvatar)" />
    <!-- Book/Clipboard in hand -->
    <rect x="-24" y="25" width="48" height="35" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <line x1="-15" y1="35" x2="15" y2="35" stroke="#3b82f6" stroke-width="2" />
    <line x1="-15" y1="45" x2="8" y2="45" stroke="#3b82f6" stroke-width="2" />
  </g>

  <rect x="25" y="295" width="300" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="175" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    [शिक्षक / कर्मचारी फोटो]
  </text>
  <text x="175" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Staff Photo Placeholder
  </text>
</svg>
