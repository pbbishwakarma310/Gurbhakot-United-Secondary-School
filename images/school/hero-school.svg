<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  
  <!-- Distant Mountains -->
  <polygon points="-50,330 180,180 380,330" fill="#60a5fa" opacity="0.6" />
  <polygon points="250,330 450,160 680,330" fill="#3b82f6" opacity="0.5" />
  <polygon points="520,330 690,190 850,330" fill="#60a5fa" opacity="0.6" />
  
  <!-- Snowcaps -->
  <polygon points="180,180 145,210 160,205 180,215 195,205 210,210" fill="#ffffff" opacity="0.8" />
  <polygon points="450,160 415,195 435,190 450,200 465,190 485,195" fill="#ffffff" opacity="0.8" />

  <!-- School Ground / Lawn -->
  <rect y="310" width="800" height="190" fill="url(#grassGrad)" />
  <path d="M 0,330 Q 400,280 800,330 L 800,500 L 0,500 Z" fill="#166534" opacity="0.3" />

  <!-- Main School Building -->
  <g transform="translate(150, 160)">
    <!-- Central Tower Section -->
    <rect x="180" y="20" width="140" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- Clock / Crest in Center Tower -->
    <circle cx="250" cy="65" r="22" fill="#0f3b7a" stroke="#f59e0b" stroke-width="3" />
    <circle cx="250" cy="65" r="18" fill="#ffffff" />
    <line x1="250" y1="65" x2="250" y2="52" stroke="#0f3b7a" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="65" x2="260" y2="65" stroke="#0f3b7a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central Roof Triangle -->
    <polygon points="170,20 250,-35 330,20" fill="url(#roofGrad)" />
    <!-- Flagpole on top -->
    <line x1="250" y1="-35" x2="250" y2="-75" stroke="#94a3b8" stroke-width="3" />
    <!-- Nepali Double-Pennant Flag -->
    <path d="M 250,-75 L 280,-62 L 260,-50 L 285,-40 L 250,-35 Z" fill="#dc2626" stroke="#1d4ed8" stroke-width="1.5" />
    <polygon points="256,-65 264,-65 260,-58" fill="#ffffff" />
    <circle cx="260" cy="-45" r="4" fill="#ffffff" />

    <!-- Left Wing (Classrooms) -->
    <rect x="0" y="55" width="180" height="145" fill="url(#bldgGrad)" stroke="#cbd5e1" stroke-width="2" />
    <polygon points="-10,55 180,55 170,30 -5,30" fill="url(#roofGrad)" />
    
    <!-- Right Wing (Classrooms) -->
    <rect x="320" y="55" width="180" height="145" fill="url(#bldgGrad)" stroke="#cbd5e1" stroke-width="2" />
    <polygon points="320,55 510,55 505,30 330,30" fill="url(#roofGrad)" />

    <!-- Blue Windows Grid (Left Wing) -->
    <g fill="#0284c7" stroke="#ffffff" stroke-width="2">
      <!-- 2nd floor -->
      <rect x="18" y="70" width="30" height="35" rx="3" />
      <rect x="58" y="70" width="30" height="35" rx="3" />
      <rect x="98" y="70" width="30" height="35" rx="3" />
      <rect x="138" y="70" width="30" height="35" rx="3" />
      <!-- 1st floor -->
      <rect x="18" y="120" width="30" height="35" rx="3" />
      <rect x="58" y="120" width="30" height="35" rx="3" />
      <rect x="98" y="120" width="30" height="35" rx="3" />
      <rect x="138" y="120" width="30" height="35" rx="3" />
    </g>

    <!-- Blue Windows Grid (Right Wing) -->
    <g fill="#0284c7" stroke="#ffffff" stroke-width="2">
      <!-- 2nd floor -->
      <rect x="338" y="70" width="30" height="35" rx="3" />
      <rect x="378" y="70" width="30" height="35" rx="3" />
      <rect x="418" y="70" width="30" height="35" rx="3" />
      <rect x="458" y="70" width="30" height="35" rx="3" />
      <!-- 1st floor -->
      <rect x="338" y="120" width="30" height="35" rx="3" />
      <rect x="378" y="120" width="30" height="35" rx="3" />
      <rect x="418" y="120" width="30" height="35" rx="3" />
      <rect x="458" y="120" width="30" height="35" rx="3" />
    </g>

    <!-- Main Entrance Door -->
    <path d="M 225,200 L 225,125 A 25,25 0 0,1 275,125 L 275,200 Z" fill="#0f3b7a" />
    <line x1="250" y1="125" x2="250" y2="200" stroke="#ffffff" stroke-width="1.5" />
    <!-- Pillars -->
    <rect x="205" y="110" width="12" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="283" y="110" width="12" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <rect x="195" y="105" width="110" height="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Trees & Garden Accents -->
  <g fill="#15803d">
    <!-- Left Trees -->
    <path d="M 60,370 C 40,340 50,300 80,290 C 110,280 140,300 130,340 C 140,360 120,380 90,380 Z" />
    <rect x="85" y="370" width="12" height="35" fill="#78350f" />
    <!-- Right Trees -->
    <path d="M 720,360 C 700,330 710,290 740,280 C 770,270 800,290 790,330 C 800,350 780,370 750,370 Z" />
    <rect x="745" y="360" width="12" height="35" fill="#78350f" />
  </g>

  <!-- Pathway -->
  <polygon points="360,360 440,360 480,500 320,500" fill="#cbd5e1" />
  <line x1="400" y1="360" x2="400" y2="500" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Welcome Overlay Badge -->
  <rect x="150" y="420" width="500" height="60" rx="30" fill="#ffffff" opacity="0.95" stroke="#0f3b7a" stroke-width="2" />
  <text x="400" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    गुर्भाकोट युनाइटेड माध्यमिक विद्यालय
  </text>
  <text x="400" y="466" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">
    Gurbhakot United Secondary School • Botechaur, Surkhet
  </text>
</svg>
