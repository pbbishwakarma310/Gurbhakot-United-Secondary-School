<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#stGrad)" />
  
  <!-- Graduation Cap & Library Books -->
  <g transform="translate(300, 160)">
    <!-- Stack of Books -->
    <rect x="-70" y="25" width="140" height="22" rx="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-60" y="0" width="120" height="22" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <rect x="-50" y="-25" width="100" height="22" rx="3" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
    <!-- Mortarboard Cap -->
    <polygon points="0,-75 75,-55 0,-35 -75,-55" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="-25" y="-55" width="50" height="20" rx="3" fill="#1e293b" />
    <!-- Tassel -->
    <path d="M 0,-55 Q 35,-50 45,-25" fill="none" stroke="#f59e0b" stroke-width="3" />
    <circle cx="45" cy="-20" r="4" fill="#f59e0b" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="325" width="540" height="55" rx="8" fill="#ffffff" />
  <text x="300" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    विद्यार्थी सिकाइ तथा पुस्तकालय / Student Life & Academic Excellence
  </text>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Gurbhakot United Secondary School
  </text>
</svg>
