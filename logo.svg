<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b7a" />
      <stop offset="100%" stop-color="#1a56b4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <!-- Text Paths for Circular Arcs -->
    <path id="topArc" d="M 50,200 A 150,150 0 1,1 350,200" fill="none" />
    <path id="bottomArc" d="M 60,200 A 140,140 0 0,0 340,200" fill="none" />
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="200" cy="200" r="190" fill="#0a2540" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="185" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="5" />
  <circle cx="200" cy="200" r="145" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />

  <!-- Circular Outer Text -->
  <text fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="800" letter-spacing="2.8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      GURBHAKOT UNITED SECONDARY SCHOOL
    </textPath>
  </text>
  
  <text fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="3.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★ BOTECHAUR, SURKHET, NEPAL ★
    </textPath>
  </text>

  <!-- Inner Center Graphic Shield -->
  <g transform="translate(0, 0)">
    <!-- Inner Sky -->
    <circle cx="200" cy="200" r="140" fill="#eff6ff" />
    
    <!-- Rising Sun with Rays -->
    <g transform="translate(200, 190)">
      <circle cx="0" cy="0" r="42" fill="url(#sunGrad)" />
      <!-- Sun Rays -->
      <path d="M 0,-42 L 0,-60 M 29,-29 L 42,-42 M 42,0 L 60,0 M -29,-29 L -42,-42 M -42,0 L -60,0 M 20,-36 L 30,-52 M -20,-36 L -30,-52" 
            stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Himalayan Peaks (Karnali / Surkhet mountains) -->
    <polygon points="100,210 160,145 220,210" fill="#93c5fd" opacity="0.9" />
    <polygon points="170,210 240,130 300,210" fill="#60a5fa" opacity="0.9" />
    <polygon points="135,215 200,140 265,215" fill="url(#mountainGrad)" />
    
    <!-- Snow Tops -->
    <polygon points="200,140 185,160 195,158 200,165 208,158 215,160" fill="#ffffff" />
    <polygon points="240,130 228,150 236,148 240,154 246,148 252,150" fill="#ffffff" />

    <!-- Open Book of Knowledge Base -->
    <g transform="translate(200, 220)">
      <!-- Book Pages Outer -->
      <path d="M -70,10 C -45,-5 -20,5 0,15 C 20,5 45,-5 70,10 L 70,38 C 45,23 20,33 0,43 C -20,33 -45,23 -70,38 Z" fill="#1e3a8a" />
      <path d="M -67,13 C -43,-2 -18,8 0,18 C 18,8 43,-2 67,13 L 67,37 C 43,22 18,32 0,42 C -18,32 -43,22 -67,37 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" />
      
      <!-- Book Spine & Pages Lines -->
      <path d="M 0,18 L 0,42" stroke="#0f3b7a" stroke-width="2" />
      <path d="M -55,16 C -38,7 -20,15 -8,22 M -55,23 C -38,14 -20,22 -8,29 M -55,30 C -38,21 -20,29 -8,36" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 55,16 C 38,7 20,15 8,22 M 55,23 C 38,14 20,22 8,29 M 55,30 C 38,21 20,29 8,36" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" />

      <!-- Flaming Torch / Pen of Wisdom -->
      <g transform="translate(0, -25)">
        <!-- Golden Pen nib pointing down -->
        <polygon points="-5,15 5,15 0,32" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
        <rect x="-4" y="-10" width="8" height="25" fill="#1e40af" rx="2" />
        <!-- Torch Flame -->
        <path d="M 0,-10 C -8,-20 0,-30 0,-35 C 4,-28 10,-24 7,-16 C 5,-12 3,-10 0,-10 Z" fill="#ef4444" />
        <path d="M 0,-12 C -4,-18 0,-24 0,-28 C 2,-23 6,-20 4,-15 C 3,-13 2,-12 0,-12 Z" fill="#f59e0b" />
      </g>
    </g>

    <!-- Laurel Wreath of Excellence (Left & Right) -->
    <g fill="url(#goldGrad)">
      <!-- Left Leaves -->
      <path d="M 80,180 Q 95,185 92,195 Q 82,192 80,180 Z" />
      <path d="M 75,200 Q 90,203 88,215 Q 77,212 75,200 Z" />
      <path d="M 78,222 Q 93,223 92,235 Q 80,234 78,222 Z" />
      <path d="M 88,242 Q 102,240 103,252 Q 92,253 88,242 Z" />
      <path d="M 105,260 Q 118,255 122,267 Q 110,270 105,260 Z" />
      
      <!-- Right Leaves -->
      <path d="M 320,180 Q 305,185 308,195 Q 318,192 320,180 Z" />
      <path d="M 325,200 Q 310,203 312,215 Q 323,212 325,200 Z" />
      <path d="M 322,222 Q 307,223 308,235 Q 320,234 322,222 Z" />
      <path d="M 312,242 Q 298,240 297,252 Q 308,253 312,242 Z" />
      <path d="M 295,260 Q 282,255 278,267 Q 290,270 295,260 Z" />
    </g>

    <!-- Golden Ribbon at Bottom with Motto -->
    <g transform="translate(200, 305)">
      <!-- Ribbon Tails -->
      <polygon points="-90,5 -110,-10 -105,18" fill="#b45309" />
      <polygon points="90,5 110,-10 105,18" fill="#b45309" />
      <!-- Ribbon Center -->
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" />
      <text x="0" y="4.5" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0f3b7a" letter-spacing="1">
        KNOWLEDGE • DISCIPLINE • SUCCESS
      </text>
    </g>
  </g>
</svg>
