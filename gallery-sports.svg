<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sGrad)" />
  
  <!-- Sports Pitch Lines -->
  <rect x="50" y="40" width="500" height="260" fill="none" stroke="#ffffff" stroke-width="4" rx="10" />
  <line x1="300" y1="40" x2="300" y2="300" stroke="#ffffff" stroke-width="4" />
  <circle cx="300" cy="170" r="50" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle cx="300" cy="170" r="6" fill="#ffffff" />
  
  <!-- Football & Trophy Icon -->
  <g transform="translate(300, 170)">
    <!-- Trophy Silhouette -->
    <path d="M -30,-45 L 30,-45 L 20,5 L -20,5 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <path d="M -40,-35 C -55,-35 -50,-10 -25,-10" fill="none" stroke="#f59e0b" stroke-width="4" />
    <path d="M 40,-35 C 55,-35 50,-10 25,-10" fill="none" stroke="#f59e0b" stroke-width="4" />
    <rect x="-10" y="5" width="20" height="20" fill="#f59e0b" />
    <rect x="-25" y="25" width="50" height="15" rx="3" fill="#d97706" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="325" width="540" height="55" rx="8" fill="#ffffff" />
  <text x="300" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    वार्षिक खेलकुद तथा अतिरिक्त क्रियाकलाप / Annual Sports & Athletics
  </text>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Gurbhakot United Secondary School
  </text>
</svg>
