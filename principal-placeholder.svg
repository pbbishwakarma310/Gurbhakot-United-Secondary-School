<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3b7a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="450" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Badge Watermark -->
  <circle cx="200" cy="180" r="130" fill="#ffffff" opacity="0.05" />
  
  <!-- Avatar Silhouette -->
  <g transform="translate(200, 190)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="48" fill="url(#avatarGrad)" />
    <!-- Formal Collar & Suit -->
    <path d="M -85,90 C -85,15 -50,-5 0,-5 C 50,-5 85,15 85,90 Z" fill="url(#avatarGrad)" />
    <!-- Shirt / Tie Accent -->
    <polygon points="-12,0 12,0 0,25" fill="#ffffff" />
    <polygon points="-5,18 5,18 8,65 0,78 -8,65" fill="#0f3b7a" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="30" y="325" width="340" height="90" rx="10" fill="#ffffff" opacity="0.95" />
  <text x="200" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    [प्रधानाध्यापकको फोटो]
  </text>
  <text x="200" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">
    Principal's Photo Placeholder
  </text>
  <text x="200" y="403" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Replace with: images/principal/principal.jpg
  </text>
</svg>
