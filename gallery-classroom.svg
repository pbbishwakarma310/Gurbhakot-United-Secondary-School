<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cGrad)" />
  <!-- Blackboard / Smart Board -->
  <rect x="120" y="40" width="360" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="6" />
  <text x="300" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    कक्षा ११ र १२ शिक्षण सिकाइ क्रियाकलाप
  </text>
  <text x="300" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">
    Classroom Teaching & Interactive Learning
  </text>
  <line x1="160" y1="145" x2="440" y2="145" stroke="#f59e0b" stroke-width="2" />
  <text x="300" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    Modern Facilities • Friendly Environment • Expert Guidance
  </text>
  
  <!-- Desks & Benches -->
  <g fill="#94a3b8">
    <rect x="80" y="250" width="120" height="45" rx="4" fill="#3b82f6" />
    <rect x="240" y="250" width="120" height="45" rx="4" fill="#3b82f6" />
    <rect x="400" y="250" width="120" height="45" rx="4" fill="#3b82f6" />
  </g>

  <!-- Bottom Info Badge -->
  <rect x="30" y="325" width="540" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="300" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f3b7a" text-anchor="middle">
    सुविधासम्पन्न कक्षाकोठा / Modern Classroom Setup
  </text>
  <text x="300" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Gurbhakot United Secondary School
  </text>
</svg>
